[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-row-position-shift"
version = "1.0.0"
description = "Shift CSV data rows by N positions with wrap-around (header preserved)."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"

[project.scripts]
csv-row-position-shift = "csv_row_position_shift.cli:main"
